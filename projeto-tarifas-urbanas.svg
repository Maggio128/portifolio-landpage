<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Planilha de componentes da tarifa de ônibus urbano</title>
  <desc id="desc">Monitor de computador exibindo custos de combustível, pneus, óleo e manutenção por quilômetro.</desc>
  <defs>
    <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#f7e8d8"/><stop offset="1" stop-color="#dfd8d0"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#273449"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#28303b" flood-opacity=".24"/></filter>
  </defs>
  <rect width="900" height="600" fill="url(#desk)"/>
  <circle cx="770" cy="100" r="130" fill="#f9c99d" opacity=".38"/>
  <rect x="104" y="70" width="692" height="412" rx="24" fill="#252b33" filter="url(#shadow)"/>
  <rect x="122" y="88" width="656" height="374" rx="9" fill="url(#screen)"/>
  <rect x="122" y="88" width="656" height="38" rx="9" fill="#e8e9eb"/>
  <circle cx="144" cy="107" r="6" fill="#e78343"/><circle cx="164" cy="107" r="6" fill="#d3a269"/><circle cx="184" cy="107" r="6" fill="#95a58b"/>
  <text x="450" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#46505c" font-weight="700">PLANILHA DE CUSTOS — TARIFA DE ÔNIBUS</text>
  <rect x="155" y="148" width="590" height="48" rx="5" fill="#ed8a48"/>
  <text x="177" y="178" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700">COMPONENTE DA TARIFA</text>
  <text x="690" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#fff" font-weight="700">CUSTO / KM</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#273449">
    <rect x="155" y="196" width="590" height="48" fill="#fffaf5"/><text x="178" y="227">Combustível (diesel)</text><text x="690" y="227" text-anchor="middle">R$ 1,42</text>
    <rect x="155" y="244" width="590" height="48" fill="#f4eee8"/><text x="178" y="275">Pneus e recapagens</text><text x="690" y="275" text-anchor="middle">R$ 0,18</text>
    <rect x="155" y="292" width="590" height="48" fill="#fffaf5"/><text x="178" y="323">Óleos e lubrificantes</text><text x="690" y="323" text-anchor="middle">R$ 0,09</text>
    <rect x="155" y="340" width="590" height="48" fill="#f4eee8"/><text x="178" y="371">Manutenção e peças</text><text x="690" y="371" text-anchor="middle">R$ 0,31</text>
    <rect x="155" y="388" width="590" height="48" fill="#fff0e2"/><text x="178" y="419" font-weight="700">CUSTO OPERACIONAL TOTAL</text><text x="690" y="419" text-anchor="middle" font-weight="700">R$ 2,00</text>
  </g>
  <path d="M420 482h60l16 56H404z" fill="#555f69"/><rect x="336" y="536" width="228" height="18" rx="9" fill="#414852"/>
  <rect x="240" y="563" width="420" height="8" rx="4" fill="#c9bdb2" opacity=".75"/>
</svg>